name: "💡 Идея / Feature request"
description: "Предложить новую возможность или улучшение / Suggest an improvement"
title: "[Идея] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Расскажите, чего не хватает. Опишите **задачу**, а не только решение: так проще придумать, как лучше всего это сделать.

        *Tell us what is missing. Describe the problem first, then the idea. English is welcome.*

  - type: textarea
    id: problem
    attributes:
      label: "Какую задачу вы решаете / The problem"
      description: "Например: «Для карты автошколы нужны стрелки только на поворотах, а не по всей линии»."
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: "Как это могло бы работать / Your idea"
      description: "Что должно появиться в окне настроек или в результате на холсте. Можно приложить скриншот или эскиз."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Чем пользуетесь сейчас / Workarounds"
      description: "Как вы обходите это сейчас? Необязательно."

  - type: dropdown
    id: scope
    attributes:
      label: "К чему относится / Area"
      options:
        - "Линия маршрута / Route line"
        - "Стрелки / Arrows"
        - "Окно настроек / Settings dialog"
        - "Установщик / Installer"
        - "Сайт или документация / Website or docs"
        - "Другое / Other"
    validations:
      required: true
