name: Release / Выпуск релиза

# Делает полноценный релиз GitHub: установщик + скрипт + SHA256SUMS.txt, двуязычное описание
# и (если добавлен секрет VT_API_KEY) проверку обоих файлов в VirusTotal со ссылками на отчёт.
#
# Как запустить:
#   • Вкладка Actions → «Release / Выпуск релиза» → Run workflow → указать тег (например v1.0.0), или
#   • git tag v1.0.1 && git push origin v1.0.1
#
# Файлы RouteDrawer.jsx и RouteDrawer-Setup.exe берутся из корня репозитория как есть — ничего не пересобирается.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза / Release tag (например v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
      scan:
        description: "Проверить файлы в VirusTotal (нужен секрет VT_API_KEY) / Scan with VirusTotal"
        required: false
        default: "yes"
        type: choice
        options: ["yes", "no"]

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - name: Checkout (with history for the changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check tag name
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Тег должен выглядеть как v1.0.0 (получено: $TAG)"
            exit 1
          fi

      - name: Verify repository integrity
        run: python3 .github/scripts/verify_integrity.py

      - name: Prepare release files and SHA256SUMS.txt
        run: |
          mkdir -p dist
          cp RouteDrawer-Setup.exe RouteDrawer.jsx dist/
          (cd dist && sha256sum RouteDrawer-Setup.exe RouteDrawer.jsx > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Scan with VirusTotal
        id: vt
        # Шаг пропускается, если секрет VT_API_KEY не добавлен или проверку отключили при ручном запуске.
        if: env.VT_API_KEY != '' && (github.event_name != 'workflow_dispatch' || inputs.scan == 'yes')
        continue-on-error: true # сбой VirusTotal не должен срывать релиз
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4 # лимит бесплатного API — 4 запроса в минуту
          files: |
            dist/RouteDrawer-Setup.exe
            dist/RouteDrawer.jsx

      - name: Write release notes (RU + EN)
        env:
          VT_ANALYSIS: ${{ steps.vt.outcome == 'success' && steps.vt.outputs.analysis || '' }}
        run: |
          python3 .github/scripts/make_release_notes.py \
            --tag "$TAG" --repo "$GH_REPO" --dist dist --vt "$VT_ANALYSIS" --out release-notes.md
          cat release-notes.md

      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Route Drawer $TAG" --notes-file release-notes.md --latest
            gh release upload "$TAG" dist/RouteDrawer-Setup.exe dist/RouteDrawer.jsx dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/RouteDrawer-Setup.exe dist/RouteDrawer.jsx dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Route Drawer $TAG" --notes-file release-notes.md --latest
          fi

      - name: Download the published files and compare checksums
        run: |
          mkdir -p published
          gh release download "$TAG" --dir published --clobber
          (cd published && sha256sum -c SHA256SUMS.txt)

      - name: Summary
        env:
          VT_OUTCOME: ${{ steps.vt.outcome }}
        run: |
          url="$(gh release view "$TAG" --json url --jq .url)"
          if [ "$VT_OUTCOME" = "success" ]; then
            vt_line="VirusTotal: ✅ файлы отправлены на проверку / files submitted"
          elif [ -z "$VT_API_KEY" ]; then
            vt_line="VirusTotal: пропущено, секрет VT_API_KEY не добавлен / skipped, no VT_API_KEY secret"
          else
            vt_line="VirusTotal: ⚠️ шаг не выполнился, релиз создан без проверки / step failed, release created without a scan"
          fi
          {
            echo "## Релиз опубликован / Release published"
            echo
            echo "[$url]($url)"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "$vt_line"
          } >> "$GITHUB_STEP_SUMMARY"
