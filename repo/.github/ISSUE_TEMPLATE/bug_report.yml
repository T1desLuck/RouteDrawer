name: "🐞 Ошибка / Bug report"
description: "Скрипт или установщик работает не так, как должен / Something does not work as expected"
title: "[Ошибка] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете об ошибке! Чем точнее описание, тем быстрее получится её исправить.
        Сначала загляните в [частые вопросы](https://github.com/T1desLuck/RouteDrawer#частые-вопросы) — возможно, ответ уже там.

        *Thank you for the report! Please check the [FAQ](https://github.com/T1desLuck/RouteDrawer#частые-вопросы) first. Writing in English is fine.*

  - type: dropdown
    id: area
    attributes:
      label: "Что не работает / What is affected"
      options:
        - "Установщик (RouteDrawer-Setup.exe) / Installer"
        - "Скрипт в Photoshop (рисование линии, стрелки) / Script in Photoshop"
        - "Окно настроек / Settings dialog"
        - "Сайт / Website"
        - "Документация (README) / Documentation"
        - "Другое / Other"
    validations:
      required: true

  - type: input
    id: photoshop
    attributes:
      label: "Версия Photoshop / Photoshop version"
      description: "Меню «Справка» → «О программе Photoshop». Например: Photoshop 2024 (25.9)."
      placeholder: "Photoshop 2024 (25.9)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Система / Operating system"
      options:
        - "Windows 11"
        - "Windows 10"
        - "macOS"
        - "Другая / Other"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "Версия Route Drawer / Route Drawer version"
      description: "Номер релиза или дата загрузки файла. Если не знаете — оставьте пустым."
      placeholder: "1.0.0"

  - type: textarea
    id: steps
    attributes:
      label: "Что вы делали / Steps to reproduce"
      description: "По шагам: сколько точек в контуре, какие настройки меняли, на каком шаге появилась ошибка."
      placeholder: |
        1. Нарисовал контур пером из 12 точек
        2. Открыл Файл → Сценарии → RouteDrawer
        3. Нажал «Нарисовать»
        4. …
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Что получилось и что ожидали / What happened and what you expected"
      description: "Если появилось окно с ошибкой — вставьте её текст целиком. Скриншоты можно перетащить прямо сюда."
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: "Проверки / Checklist"
      options:
        - label: "Я проверил(а) раздел «Частые вопросы» в README / I checked the FAQ"
          required: true
        - label: "Контур построен инструментом «Перо» в режиме «Контур» (Path), а не «Фигура» / The path was drawn with the Pen tool in Path mode"
          required: false
